[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium_gates_nutrition_optimization"
description = "Research repository for the vivarium_gates_nutrition_optimization project."
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
dependencies = [
    "vivarium-dependencies[pandas,numpy,scipy,click,tables,loguru]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
    "vivarium-gbd-mapping>=6.0.0,<7.0.0",
    "vivarium-engine>=6.0.0,<7.0.0",
    "vivarium-public-health>=6.6.4,<7.0.0",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "vivarium-dependencies[pytest]",
    "pytest-vivarium",
]
interactive = [
    "vivarium-dependencies[interactive]",
    "vivarium-interactive>=1.0.0,<2.0.0",
]
lint = ["vivarium-dependencies[lint]"]
cluster = ["vivarium-cluster-tools[cluster]>=4.8.0,<5.0.0"]
data = [
    "vivarium-inputs>=9.0.0,<10.0.0",
    "vivarium-gbd-access>=7.0.0,<8.0.0",
]
# Every extra that installs from public PyPI alone. cluster and data need the IHME
# artifactory, so `make build-env artifactory_access=no` installs this instead of dev.
public = ["vivarium_gates_nutrition_optimization[test,interactive,lint]"]
dev = ["vivarium_gates_nutrition_optimization[public,cluster,data]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium_gates_nutrition_optimization"

[project.scripts]
make_artifacts = "vivarium_gates_nutrition_optimization.tools.cli:make_artifacts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vivarium_gates_nutrition_optimization" = ["**/*.yaml", "**/*.ipynb", "**/*.csv"]

[tool.setuptools_scm]
tag_regex = '^(?P<prefix>v)?(?P<version>[^\+]+)(?P<suffix>.*)?$'
fallback_version = "0.0.0+no-git-tag"

[tool.black]
line-length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3

[tool.uv]
# pyarrow 26 needs numpy 2 but does not declare it, so cap it while numpy<2 is here.
# TODO: remove the pyarrow cap with numpy<2 once GBD siloing (MIC-7613) is merged.
override-dependencies = ["pandas<3.0.0", "sqlalchemy>=2.0.0,<3.0.0", "numpy<2.0.0", "pyarrow<26.0.0"]
